<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車款大小查詢工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1013; --panel:#16191f; --panel-2:#1c2029; --line:#2a2f3a; --line-soft:#21252e;
    --text:#e7e9ee; --text-dim:#8b92a1; --text-faint:#565d6b;
    --amber:#e0a63d; --amber-dim:#8a6a2c; --teal:#46b8a0; --violet:#8b8ff2; --red:#d9614f; --green:#5fc17e;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  [hidden]{display:none !important;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#2c313d;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#14161b,#111318);position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;}
  .brand .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);border:1px solid var(--amber-dim);padding:2px 6px;border-radius:5px;letter-spacing:.05em;}

  .sync-pill{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 12px;border-radius:12px;
    border:1px solid var(--line);color:var(--text-dim);background:var(--panel-2);white-space:nowrap;}
  .sync-pill.ok{color:var(--green);border-color:#245239;}
  .sync-pill.err{color:var(--red);border-color:#6b3a24;}
  .sync-pill.busy{color:var(--amber);border-color:var(--amber-dim);}

  main{max-width:1100px;margin:0 auto;padding:24px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .panel-title{font-size:17px;display:flex;align-items:center;gap:8px;}
  .panel-sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}

  .btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:8px 16px;border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:.15s;white-space:nowrap;}
  .btn:hover{border-color:#3a4150;background:#22262f;}
  .btn.primary{background:var(--amber);color:#161a10;border-color:var(--amber);}
  .btn.primary:hover{background:#eab653;}
  .btn.danger{color:var(--red);}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:6px;}

  select, input[type=text]{background:#0f1116;border:1px solid var(--line);color:var(--text);border-radius:7px;
    padding:9px 12px;font-family:'JetBrains Mono',monospace;font-size:13px;}
  select{font-family:'Inter',sans-serif;}
  label.field, div.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text-dim);font-weight:600;}

  .search-row{margin-bottom:6px;}
  .search-row input{width:100%;max-width:420px;font-size:16px;padding:13px 16px;}
  .search-row label.field{gap:7px;}

  .cat-badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;}
  .cat-badge.小車{background:#16281f;color:var(--green);}
  .cat-badge.一般車{background:#1c2440;color:var(--violet);}
  .cat-badge.大車{background:#2c2416;color:var(--amber);}
  .cat-badge.商用車{background:#2c1f18;color:var(--red);}

  .pill-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .pill-tabs button{background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);
    padding:8px 16px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;}
  .pill-tabs button.active{background:var(--amber);color:#161a10;border-color:var(--amber);}
  .pill-tabs button.add{border-style:dashed;color:var(--text-faint);}

  table.data{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.data th{text-align:right;color:var(--text-dim);font-weight:600;font-size:11.5px;white-space:nowrap;
    text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel-2);}
  table.data th:first-child, table.data td:first-child{text-align:left;}
  table.data td{padding:11px 10px;border-bottom:1px solid var(--line-soft);text-align:right;font-family:'JetBrains Mono',monospace;}
  table.data tr:hover td{background:#191d25;}
  .table-scroll{overflow-x:auto;}
  .empty-hint{color:var(--text-faint);font-size:12.5px;padding:10px 2px;}
  .result-count{color:var(--text-dim);font-size:12.5px;margin-bottom:10px;}

  input.cell-input, select.cell-select{
    width:100%;padding:5px 8px;background:transparent;border:1px solid transparent;color:var(--text);
    border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:13px;text-align:right;
  }
  select.cell-select{text-align:left;font-family:'Inter',sans-serif;}
  input.cell-input:hover, select.cell-select:hover{background:#181c24;border-color:var(--line);}
  input.cell-input:focus, select.cell-select:focus{background:#0f1116;border-color:var(--amber-dim);outline:none;}
  select.cat-select{font-weight:700;}

  .row-actions{display:flex;gap:2px;justify-content:flex-end;opacity:.45;transition:opacity .15s;}
  tr:hover .row-actions{opacity:1;}
  .icon-btn{
    background:transparent;border:1px solid transparent;color:var(--text-faint);
    width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;
    display:inline-flex;align-items:center;justify-content:center;transition:.12s;
  }
  .icon-btn:hover{background:var(--panel-2);border-color:var(--line);color:var(--text);}
  .icon-btn.danger:hover{color:var(--red);border-color:#6b3a24;}
  select.cat-select.小車{color:var(--green);}
  select.cat-select.一般車{color:var(--violet);}
  select.cat-select.大車{color:var(--amber);}
  select.cat-select.商用車{color:var(--red);}

  .modal-overlay{position:fixed;inset:0;background:rgba(6,7,10,.65);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:300;overflow-y:auto;}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
  .modal-head .modal-title{font-size:17px;font-weight:700;font-family:'Rajdhani',sans-serif;}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--panel-2);border:1px solid var(--amber-dim);color:var(--amber);
    padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:200;}
  .toast.show{opacity:1;transform:translateY(0);}

  .lock-pill{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 12px;border-radius:12px;
    border:1px solid var(--line);color:var(--text-dim);background:var(--panel-2);cursor:pointer;white-space:nowrap;}
  .lock-pill.unlocked{color:var(--green);border-color:#245239;}
  .unlock-box{max-width:320px;}
  .unlock-error{color:var(--red);font-size:12.5px;min-height:16px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🚗 車款大小查詢工具 <span class="tag">獨立功能</span></div>
  <div style="display:flex;align-items:center;gap:14px;">
    <span class="sync-pill busy" id="syncTag">連線中…</span>
    <button class="lock-pill" id="lockPill">🔒 解鎖編輯</button>
  </div>
</div>

<main id="app"></main>
<div class="toast" id="toast"></div>
<input type="file" id="importFileInput" accept="application/json" hidden>

<div class="modal-overlay" id="unlockOverlay" hidden>
  <div class="modal-box unlock-box">
    <div class="modal-head">
      <div class="modal-title">輸入密碼以編輯</div>
      <button class="btn sm" id="unlockCloseX">✕</button>
    </div>
    <form id="unlockForm">
      <div class="modal-body">
        <label class="field">密碼
          <input type="password" id="unlockPassword" autocomplete="current-password" required autofocus style="font-family:'JetBrains Mono',monospace;">
        </label>
        <div class="unlock-error" id="unlockError"></div>
      </div>
      <div class="modal-foot">
        <button type="submit" class="btn primary">解鎖</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="btn sm" id="modalCloseX">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" id="modalCancelBtn">取消</button>
      <button class="btn primary" id="modalDoneBtn">完成</button>
    </div>
  </div>
</div>

/* =========================================================
   後端連線設定
   部署時請修改成你實際的後端網址（見 backend/README.md 與 deploy/gcp-deploy.md）
   ========================================================= */
const API_BASE = "http://localhost:4000/api";

let DB = null;
let dbVersion = null;
const STORAGE_KEY = "vehicle-size-lookup-db";

/* ---- 密碼解鎖（僅新增/編輯/刪除車款需要；查詢瀏覽任何人都能用）---- */
const AUTH_KEY = 'auth-session';
function getAuth(){
  try{ return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }catch(e){ return null; }
}
function setAuth(auth){ try{ localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }catch(e){} }
function clearAuth(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }
function isAdmin(){ return getAuth()?.role === 'admin'; }
function apiHeaders(withJson){
  const auth = getAuth();
  const h = {};
  if(auth?.token) h['Authorization'] = 'Bearer ' + auth.token;
  if(withJson) h['Content-Type'] = 'application/json';
  return h;
}
async function unlockWithPassword(password){
  const res = await fetch(`${API_BASE}/auth/unlock-settings`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password })
  });
  const json = await res.json();
  if(!res.ok) throw new Error(json.error || '解鎖失敗');
  setAuth({ token: json.token, username: json.username, role: json.role });
}
function showUnlockOverlay(message){
  document.getElementById('unlockError').textContent = message || '';
  document.getElementById('unlockPassword').value = '';
  document.getElementById('unlockOverlay').hidden = false;
  document.getElementById('unlockPassword').focus();
}
function hideUnlockOverlay(){ document.getElementById('unlockOverlay').hidden = true; }
function updateAuthUI(){
  const unlocked = isAdmin();
  const pill = document.getElementById('lockPill');
  pill.textContent = unlocked ? '🔓 已解鎖（點此鎖定）' : '🔒 解鎖編輯';
  pill.classList.toggle('unlocked', unlocked);
  document.querySelectorAll('.admin-only').forEach(el=>{ el.style.display = unlocked ? '' : 'none'; });
}
function setSyncTag(state, text){
  const el = document.getElementById('syncTag');
  if(!el) return;
  el.className = 'sync-pill ' + state;
  el.textContent = text;
}
function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

async function loadDB(){
  setSyncTag('busy', '連線中…');
  try{
    const res = await fetch(`${API_BASE}/vehicle-catalog`, { headers: apiHeaders(false) });
    if(res.ok){
      const json = await res.json();
      DB = json.data; dbVersion = json.version;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
      setSyncTag('ok', '已同步 · ' + nowHM());
      return;
    }
    if(res.status === 404){
      // 後端尚無資料：使用出廠預設值；已解鎖才寫回後端建立初始版本，避免一般訪客觸發無權限的寫入
      DB = factoryVehicleDB();
      if(isAdmin()){
        await saveDB();
      } else {
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
        setSyncTag('err', '尚無資料（解鎖後可建立）');
      }
      return;
    }
    throw new Error('後端回應異常：' + res.status);
  }catch(e){
    console.error(e);
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(err){}
    DB = raw ? JSON.parse(raw) : factoryVehicleDB();
    setSyncTag('err', '離線快取中');
  }
}
async function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
  setSyncTag('busy', '儲存中…');
  try{
    const res = await fetch(`${API_BASE}/vehicle-catalog`, {
      method: 'PUT',
      headers: apiHeaders(true),
      body: JSON.stringify({ expectedVersion: dbVersion, data: DB })
    });
    if(res.status === 401 || res.status === 403){
      clearAuth(); updateAuthUI();
      setSyncTag('err', '離線快取中');
      toast('⚠ 編輯權限已失效，請重新解鎖後再試一次');
      return;
    }
    if(res.status === 409){
      setSyncTag('err', '版本衝突');
      toast('⚠ 資料已被其他裝置更新，請重新整理頁面');
      return;
    }
    if(!res.ok) throw new Error('儲存失敗：' + res.status);
    const json = await res.json();
    dbVersion = json.version;
    setSyncTag('ok', '已同步 · ' + nowHM());
  }catch(e){
    console.error(e);
    setSyncTag('err', '離線快取中');
    toast('⚠ 儲存失敗，已存於本機，恢復連線後請重新整理再試');
  }
}

function exportDB(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = STORAGE_KEY + '-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('已匯出設定檔');
}
async function importDBFromFile(file){
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || !Array.isArray(parsed.vehicles) || !Array.isArray(parsed.brandOrder)){
      alert('檔案格式不正確（缺少 brandOrder / vehicles）');
      return;
    }
    if(!confirm('確定要匯入此檔案，覆蓋目前所有車款資料嗎？此動作無法復原。')) return;
    DB = parsed;
    await saveDB();
    toast('已匯入車款資料');
    render();
  }catch(err){
    console.error(err);
    alert('檔案讀取或格式錯誤，匯入失敗');
  }
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---- 通用彈出視窗 ---- */
function openModal(title, renderBody, onSave){
  const overlay = document.getElementById('modalOverlay');
  document.getElementById('modalTitle').textContent = title;
  const bodyEl = document.getElementById('modalBody');
  bodyEl.innerHTML = '';
  renderBody(bodyEl);
  overlay.hidden = false;
  const close = ()=>{ overlay.hidden = true; };
  document.getElementById('modalCloseX').onclick = close;
  document.getElementById('modalCancelBtn').onclick = close;
  document.getElementById('modalDoneBtn').onclick = async ()=>{
    const ok = await onSave();
    if(ok !== false) close();
  };
  overlay.onclick = (e)=>{ if(e.target===overlay) close(); };
  return { close };
}

/* =========================================================
   狀態 & 畫面
   ========================================================= */
let state = { brandTab:'全部', keyword:'' };

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="panel">
      <div class="panel-title" style="margin-bottom:10px;">🔍 快速搜尋車款</div>
      <div class="panel-sub" style="margin-bottom:12px;">車輛進場時直接打關鍵字（例如「RAV4」），就能快速看到品牌與大小歸類</div>
      <div class="search-row">
        <label class="field">
          <input type="text" id="keywordInput" placeholder="輸入車款關鍵字，例如：RAV4、Corolla..." value="${state.keyword}" autofocus>
        </label>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">📋 車款一覽表</div>
          <div class="panel-sub">先點廠牌看該廠牌內建車款清單；上方關鍵字搜尋會跨全部廠牌</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn sm" id="exportBtn">⭳ 匯出JSON</button>
          <button class="btn sm admin-only" id="importBtn" style="display:none;">⭱ 匯入JSON</button>
          <button class="btn primary sm admin-only" id="addVehicleBtn" style="display:none;">＋ 新增車款</button>
        </div>
      </div>
      <div class="pill-tabs" id="brandTabs">
        <button data-brand="全部" class="${state.brandTab==='全部'?'active':''}">全部</button>
        ${DB.brandOrder.map(b=>`<button data-brand="${b}" class="${state.brandTab===b?'active':''}">${b}</button>`).join('')}
        <button class="add admin-only" id="addBrandBtn" style="display:none;">＋ 新增廠牌</button>
      </div>
      <div id="vehicleTableWrap"></div>
    </div>
  `;

  document.getElementById('keywordInput').oninput = e=>{ state.keyword=e.target.value; renderVehicleTable(); };
  document.querySelectorAll('#brandTabs button[data-brand]').forEach(b=>{
    b.onclick = ()=>{ state.brandTab = b.dataset.brand; render(); };
  });
  document.getElementById('addBrandBtn').onclick = async ()=>{
    const name = prompt('新增廠牌名稱？');
    if(!name || DB.brandOrder.includes(name)) return;
    DB.brandOrder.push(name);
    await saveDB(); state.brandTab=name; render();
  };
  document.getElementById('exportBtn').onclick = exportDB;
  document.getElementById('importBtn').onclick = ()=> document.getElementById('importFileInput').click();
  document.getElementById('addVehicleBtn').onclick = ()=>{
    openModal('新增車款', (modalBody)=>{
      modalBody.innerHTML = `
        <label class="field">廠牌
          <select id="mvBrand">${DB.brandOrder.map(b=>`<option value="${b}" ${state.brandTab!=='全部'&&b===state.brandTab?'selected':''}>${b}</option>`).join('')}</select>
        </label>
        <label class="field">車款名稱
          <input type="text" id="mvModel" placeholder="例如：Corolla Cross" style="font-family:'Inter',sans-serif;">
        </label>
        <label class="field">車長（約）
          <input type="text" id="mvLength" placeholder="例如：4.5米">
        </label>
        <label class="field">歸類
          <select id="mvCat">${CAT_LIST.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        </label>
      `;
    }, async ()=>{
      const brand = document.getElementById('mvBrand').value;
      const model = document.getElementById('mvModel').value.trim();
      const length = document.getElementById('mvLength').value.trim();
      const cat = document.getElementById('mvCat').value;
      if(!model){ alert('請輸入車款名稱'); return false; }
      DB.vehicles.push({ id:'v'+Date.now()+Math.random().toString(36).slice(2,6), brand, model, length, cat });
      await saveDB();
      state.brandTab = brand; state.keyword=''; toast('已新增車款：'+model);
      render();
    });
  };

  renderVehicleTable();
}

function renderVehicleTable(){
  const wrap = document.getElementById('vehicleTableWrap');
  const kw = state.keyword.trim().toLowerCase();
  let list = DB.vehicles;
  const searching = !!kw;
  if(searching){
    list = list.filter(v => v.model.toLowerCase().includes(kw) || v.brand.toLowerCase().includes(kw));
  } else if(state.brandTab !== '全部'){
    list = list.filter(v => v.brand === state.brandTab);
  }
  const showBrandCol = state.brandTab==='全部' || searching;

  const countLine = searching ? `<div class="result-count">關鍵字「${state.keyword}」共找到 ${list.length} 筆</div>` : '';

  if(list.length===0){
    wrap.innerHTML = `${countLine}<div class="empty-hint">沒有符合的車款，可以點右上角「＋ 新增車款」補上</div>`;
    return;
  }

  wrap.innerHTML = `
    ${countLine}
    <div class="table-scroll">
    <table class="data">
      <tr>
        ${showBrandCol?'<th style="text-align:left;">廠牌</th>':''}
        <th style="text-align:left;">車款名稱</th>
        <th>車長</th>
        <th>歸類</th>
        <th></th>
      </tr>
      ${list.map(v=>`
        <tr>
          ${showBrandCol?`<td style="text-align:left;">${v.brand}</td>`:''}
          <td style="text-align:left;">${v.model}</td>
          <td>${v.length||'<span class="empty-hint">—</span>'}</td>
          <td><span class="cat-badge ${v.cat}">${v.cat}</span></td>
          <td>
            <div class="row-actions admin-only" style="display:none;">
              <button class="icon-btn" data-edit-id="${v.id}" title="編輯">✎</button>
              <button class="icon-btn danger" data-del-id="${v.id}" title="刪除">✕</button>
            </div>
          </td>
        </tr>
      `).join('')}
    </table>
    </div>
  `;

  wrap.querySelectorAll('[data-edit-id]').forEach(btn=>{
    btn.onclick = ()=>{
      const v = DB.vehicles.find(x=>x.id===btn.dataset.editId);
      openModal(`編輯車款：${v.brand} ${v.model}`, (modalBody)=>{
        modalBody.innerHTML = `
          <label class="field">廠牌
            <select id="evBrand">${DB.brandOrder.map(b=>`<option value="${b}" ${b===v.brand?'selected':''}>${b}</option>`).join('')}</select>
          </label>
          <label class="field">車款名稱
            <input type="text" id="evModel" value="${v.model}" style="font-family:'Inter',sans-serif;">
          </label>
          <label class="field">車長（約）
            <input type="text" id="evLength" value="${v.length||''}" placeholder="例如：4.5米">
          </label>
          <label class="field">歸類
            <select id="evCat">${CAT_LIST.map(c=>`<option value="${c}" ${c===v.cat?'selected':''}>${c}</option>`).join('')}</select>
          </label>
        `;
      }, async ()=>{
        const model = document.getElementById('evModel').value.trim();
        if(!model){ alert('請輸入車款名稱'); return false; }
        v.brand = document.getElementById('evBrand').value;
        v.model = model;
        v.length = document.getElementById('evLength').value.trim();
        v.cat = document.getElementById('evCat').value;
        await saveDB(); toast('已儲存修改');
        renderVehicleTable();
      });
    };
  });
  wrap.querySelectorAll('[data-del-id]').forEach(btn=>{
    btn.onclick = async ()=>{
      const v = DB.vehicles.find(x=>x.id===btn.dataset.delId);
      if(!confirm(`確定刪除「${v.brand} ${v.model}」？`)) return;
      DB.vehicles = DB.vehicles.filter(x=>x.id!==v.id);
      await saveDB(); renderVehicleTable();
    };
  });
  updateAuthUI();
}

document.getElementById('importFileInput').onchange = (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(file) importDBFromFile(file);
};

document.getElementById('unlockForm').onsubmit = async (e)=>{
  e.preventDefault();
  const password = document.getElementById('unlockPassword').value;
  try{
    await unlockWithPassword(password);
    hideUnlockOverlay();
    updateAuthUI();
    render();
  }catch(err){
    document.getElementById('unlockError').textContent = err.message;
  }
};
document.getElementById('unlockCloseX').onclick = hideUnlockOverlay;
document.getElementById('lockPill').onclick = ()=>{
  if(isAdmin()){
    clearAuth();
    updateAuthUI();
    render();
    toast('已鎖定編輯功能');
  } else {
    showUnlockOverlay();
  }
};

(async function init(){
  await loadDB();
  render();
  updateAuthUI();
})();
</script>
