<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車體工藝中心常用系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1013; --panel:#16191f; --panel-2:#1c2029; --line:#2a2f3a; --line-soft:#21252e;
    --text:#e7e9ee; --text-dim:#8b92a1; --text-faint:#565d6b;
    --amber:#e0a63d; --amber-dim:#8a6a2c; --teal:#46b8a0; --violet:#8b8ff2; --red:#d9614f; --green:#5fc17e;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;}
  h1,h2,h3{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.02em;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#2c313d;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .topbar{display:flex;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#14161b,#111318);position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;}
  .brand .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);border:1px solid var(--amber-dim);padding:2px 6px;border-radius:5px;letter-spacing:.05em;}

  main{max-width:1100px;margin:0 auto;padding:40px 24px 60px;}
  .intro{margin-bottom:28px;}
  .intro h1{font-size:26px;margin:0 0 6px;}
  .intro p{color:var(--text-dim);margin:0;font-size:13.5px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;
    display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s;}
  .card:not(.disabled):hover{border-color:var(--amber-dim);transform:translateY(-2px);}
  .card .icon{font-size:32px;line-height:1;}
  .card .title{font-family:'Rajdhani',sans-serif;font-size:19px;font-weight:700;}
  .card .desc{color:var(--text-dim);font-size:12.5px;}
  .card.disabled{color:var(--text-faint);cursor:default;border-style:dashed;}
  .card.disabled .title{color:var(--text-faint);}
  .card .badge{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:10px;
    border:1px solid var(--line);color:var(--text-dim);margin-top:auto;}
  .card.disabled .badge{border-color:var(--line-soft);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">🔧 車體工藝中心常用系統</div>
</div>

<main>
  <div class="intro">
    <h1>常用功能</h1>
    <p>選擇下方功能進入該模組的完整畫面；未來新增功能只需在此頁加卡片，不影響既有模組的資料與設定。</p>
  </div>
  <div class="grid">
    <a class="card" href="quote-system-v14.html">
      <div class="icon">🦏</div>
      <div class="title">貼膜報價系統</div>
      <div class="desc">整台車／局部貼膜／鈑烤估價，含系統設定與後台資料庫同步</div>
      <span class="badge">功能 1</span>
    </a>
    <a class="card" href="vehicle-lookup.html">
      <div class="icon">🚗</div>
      <div class="title">車型查詢小模組</div>
      <div class="desc">依廠牌查詢車款分類大小</div>
      <span class="badge">功能 2</span>
    </a>
    <div class="card disabled">
      <div class="icon">➕</div>
      <div class="title">擴充功能</div>
      <div class="desc">預留位置，未來新增模組會放在這裡</div>
      <span class="badge">功能 3・待開發</span>
    </div>
  </div>
</main>

</body>
</html>
