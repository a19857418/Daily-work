<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車體工藝中心系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e1013;
    --panel: #16191f;
    --panel-2: #1c2029;
    --line: #2a2f3a;
    --line-soft: #21252e;
    --text: #e7e9ee;
    --text-dim: #8b92a1;
    --text-faint: #565d6b;
    --amber: #e0a63d;
    --amber-dim: #8a6a2c;
    --teal: #46b8a0;
    --violet: #8b8ff2;
    --red: #d9614f;
    --green: #5fc17e;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#2c313d;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#14161b,#111318);
    position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;color:var(--text);}
  .brand .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);border:1px solid var(--amber-dim);padding:2px 6px;border-radius:5px;letter-spacing:.05em;}
  .topbar-left{display:flex;align-items:center;gap:16px;}
  .back-link{color:var(--text-dim);text-decoration:none;font-size:13px;white-space:nowrap;}
  .back-link:hover{color:var(--amber);}
  .toplinks{display:flex;gap:6px;flex-wrap:wrap;}
  .toplinks button{
    background:transparent;border:1px solid transparent;color:var(--text-dim);
    padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;transition:.15s;white-space:nowrap;
  }
  .toplinks button:hover{color:var(--text);background:var(--panel-2);}
  .toplinks button.active{color:#12140f;background:var(--amber);}

  .topbar-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .sync-pill{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 12px;border-radius:12px;
    border:1px solid var(--line);color:var(--text-dim);background:var(--panel-2);white-space:nowrap;}

  .home-wrap{max-width:1100px;margin:0 auto;padding:40px 24px 60px;}
  .home-wrap h1{font-size:26px;margin:0 0 6px;}
  .home-wrap .home-sub{color:var(--text-dim);font-size:13.5px;margin:0 0 28px;}
  .module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
  .module-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;
    display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s;}
  .module-card:not(.disabled):hover{border-color:var(--amber-dim);transform:translateY(-2px);}
  .module-card .icon{font-size:32px;line-height:1;}
  .module-card .title{font-family:'Rajdhani',sans-serif;font-size:19px;font-weight:700;}
  .module-card .desc{color:var(--text-dim);font-size:12.5px;}
  .module-card.disabled{color:var(--text-faint);cursor:default;border-style:dashed;}
  .module-card.disabled .title{color:var(--text-faint);}
  .module-card .badge{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:10px;
    border:1px solid var(--line);color:var(--text-dim);margin-top:auto;}
  .placeholder-page{max-width:640px;margin:60px auto;text-align:center;color:var(--text-dim);}
  .placeholder-page .icon{font-size:40px;margin-bottom:12px;}
  .placeholder-page .title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
  .sync-pill.ok{color:var(--green);border-color:#245239;}
  .sync-pill.err{color:var(--red);border-color:#6b3a24;}
  .sync-pill.busy{color:var(--amber);border-color:var(--amber-dim);}
  .lock-pill{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 12px;border-radius:12px;
    border:1px solid var(--line);color:var(--text-dim);background:var(--panel-2);cursor:pointer;white-space:nowrap;}
  .lock-pill.unlocked{color:var(--green);border-color:#245239;}
  .unlock-box{max-width:320px;}
  .unlock-error{color:var(--red);font-size:12.5px;min-height:16px;}

  main{max-width:1320px;margin:0 auto;padding:24px;}
  [hidden]{display:none !important;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .panel-title{font-size:17px;display:flex;align-items:center;gap:8px;}
  .panel-sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}

  .btn{
    border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;transition:.15s;white-space:nowrap;
  }
  .btn:hover{border-color:#3a4150;background:#22262f;}
  .btn.primary{background:var(--amber);color:#161a10;border-color:var(--amber);}
  .btn.primary:hover{background:#eab653;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--red);}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:6px;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}

  .pill-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .pill-tabs button{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);
    padding:8px 16px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;
  }
  .pill-tabs button.active{background:var(--amber);color:#161a10;border-color:var(--amber);}
  .pill-tabs button.add{border-style:dashed;color:var(--text-faint);}

  select, input[type=text], input[type=number], input[type=date]{
    background:#0f1116;border:1px solid var(--line);color:var(--text);
    border-radius:7px;padding:7px 10px;font-family:'JetBrains Mono',monospace;font-size:13px;
  }
  select{font-family:'Inter',sans-serif;}
  input[type=number]{width:100px;}
  label.field, div.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text-dim);font-weight:600;}
  .readonly-field{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;color:var(--text);padding:7px 0;}

  table.data{width:100%;border-collapse:collapse;font-size:13px;}
  table.data th{
    text-align:right;color:var(--text-dim);font-weight:600;font-size:11.5px;white-space:nowrap;
    text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);
    background:var(--panel-2);
  }
  table.data th:first-child, table.data td:first-child{text-align:left;}
  table.data td{padding:9px 10px;border-bottom:1px solid var(--line-soft);text-align:right;font-family:'JetBrains Mono',monospace;white-space:nowrap;}
  table.data tr:hover td{background:#191d25;}
  .table-scroll{overflow-x:auto;}
  table.data tr.total-row td{font-weight:700;color:var(--amber);border-top:1px solid var(--amber-dim);border-bottom:none;}
  .placeholder-val{color:var(--text-faint);font-style:italic;font-family:'Inter',sans-serif;}
  .val-amber{color:var(--amber);font-weight:600;}
  .val-teal{color:var(--teal);}
  .val-violet{color:var(--violet);font-weight:600;}
  .val-green{color:var(--green);font-weight:600;}
  .note{font-size:10.5px;color:var(--text-faint);display:block;font-family:'Inter',sans-serif;}
  input.cell-input{
    width:100px;text-align:right;padding:4px 8px;
    background:transparent;border:1px solid transparent;color:var(--text);border-radius:6px;
    font-family:'JetBrains Mono',monospace;font-size:13px;transition:.12s;
  }
  input.cell-input::placeholder{color:var(--text);opacity:1;font-family:'JetBrains Mono',monospace;}
  input.op-manual-input::placeholder{color:var(--text-faint);opacity:1;}
  input.meta-input::placeholder{color:var(--text-faint);font-style:italic;opacity:1;font-family:'Inter',sans-serif;}
  input.cell-input:hover{background:#181c24;border-color:var(--line);}
  input.cell-input:focus{background:#0f1116;border-color:var(--amber-dim);outline:none;}

  .price-main{font-size:15px;font-weight:700;}
  .price-sub{margin-top:3px;font-size:10.5px;color:var(--text-faint);}
  .price-sub-row{margin-top:3px;display:flex;align-items:center;justify-content:flex-end;gap:3px;}
  .price-sub-label{font-size:10.5px;color:var(--text-faint);}
  input.price-sub-input, input.price-sub-input:hover, input.price-sub-input:focus{font-size:10.5px;color:var(--text-faint);text-align:right;padding:0;margin:0;background:transparent;border:none;border-radius:0;box-shadow:none;outline:none;}
  input.price-sub-input::placeholder{color:var(--text-faint);opacity:1;font-family:'JetBrains Mono',monospace;}

  .setting-row{
    display:grid;grid-template-columns:1.4fr 130px 60px;gap:14px;align-items:center;
    padding:10px 4px;border-bottom:1px solid var(--line-soft);
  }
  .setting-row .rowname{font-weight:600;}
  .setting-row .rm{justify-self:end;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:5px 8px 5px 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .chip button{background:transparent;border:none;color:var(--text-faint);cursor:pointer;font-size:14px;line-height:1;}
  .add-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .add-inline input{width:160px;}

  .quote-head{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;margin-bottom:18px;}
  .badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;margin-left:8px;}
  .badge.internal{background:#2c2416;color:var(--amber);}
  .badge.external{background:#16281f;color:var(--green);}
  .divider-line{border:none;border-top:1px dashed var(--line);margin:18px 0;position:relative;}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--panel-2);border:1px solid var(--amber-dim);color:var(--amber);
    padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:200;}
  .toast.show{opacity:1;transform:translateY(0);}
  .empty-hint{color:var(--text-faint);font-size:12.5px;padding:10px 2px;}
  .section-nav{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:0;flex-wrap:wrap;}
  .section-nav button{
    background:transparent;border:none;color:var(--text-dim);padding:10px 4px;margin-right:18px;font-weight:600;
    font-size:14px;cursor:pointer;border-bottom:2px solid transparent;
  }
  .section-nav button.active{color:var(--amber);border-bottom-color:var(--amber);}
  .roll-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .subtle-panel{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;}

  /* ---------- hover tooltip (replaces always-visible note text) ---------- */
  .info-dot{
    display:inline-flex;align-items:center;justify-content:center;margin-left:6px;width:15px;height:15px;border-radius:50%;
    background:var(--panel-2);border:1px solid var(--line);color:var(--text-faint);font-size:10px;font-style:normal;
    font-family:'Inter',sans-serif;cursor:help;position:relative;vertical-align:middle;
  }
  .info-dot:hover{color:var(--amber);border-color:var(--amber-dim);}
  .info-dot:hover::after{
    content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%);bottom:130%;
    background:#0f1116;border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:7px;
    font-size:11px;font-weight:500;line-height:1.4;white-space:normal;width:max-content;max-width:220px;
    text-align:left;z-index:80;box-shadow:0 6px 18px rgba(0,0,0,.45);
  }

  /* ---------- settings shell: sidebar layout ---------- */
  .settings-shell{display:flex;gap:24px;align-items:flex-start;}
  .settings-sidebar{width:160px;flex-shrink:0;position:sticky;top:78px;}
  .settings-sidebar .group-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin:16px 0 6px;padding-left:10px;}
  .settings-sidebar .group-label:first-child{margin-top:0;}
  .settings-sidebar button{
    display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text-dim);
    padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:3px;
  }
  .settings-sidebar button:hover{background:var(--panel-2);color:var(--text);}
  .settings-sidebar button.active{background:var(--panel-2);color:var(--amber);border-color:var(--amber-dim);}
  .settings-main{flex:1;min-width:0;}

  /* ---------- card list w/ tag chips ---------- */
  .card-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .item-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:10px;width:230px;flex:0 0 auto;}
  .item-card .item-main{min-width:0;}
  .item-card .item-title{font-weight:700;font-size:14.5px;margin-bottom:7px;}
  .item-card .item-tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{display:inline-flex;align-items:center;gap:4px;background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);border-radius:14px;padding:3px 10px;font-size:11.5px;font-weight:600;font-family:'JetBrains Mono',monospace;}
  .tag.tag-green{color:var(--green);border-color:#245239;}
  .tag.tag-amber{color:var(--amber);border-color:var(--amber-dim);}
  .tag.tag-violet{color:var(--violet);border-color:#3d3f6b;}
  .item-actions{display:flex;gap:8px;flex-shrink:0;}

  /* ---------- modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(6,7,10,.65);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:300;overflow-y:auto;}
  .modal-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);}
  .modal-head .modal-title{font-size:17px;font-weight:700;font-family:'Rajdhani',sans-serif;}
  .modal-body{padding:20px 22px;max-height:65vh;overflow-y:auto;}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);}
  @media print{
    @page{ size: A4 landscape; margin: 10mm; }
    .topbar,.no-print{display:none !important;}
    body{background:#fff;color:#000;}
    .panel{border:1px solid #ccc;background:#fff;}
    table.data{font-size:9.5px;table-layout:fixed;width:100%;}
    table.data th, table.data td{padding:4px 5px !important;color:#000 !important;white-space:normal !important;word-break:break-word;overflow-wrap:break-word;}
    .table-scroll{overflow:visible !important;}
    input.cell-input{width:100% !important;max-width:100%;min-width:0;box-sizing:border-box;padding:2px 3px !important;}
    .price-main{font-size:10px !important;}
    .price-sub, .price-sub-label{font-size:8px !important;color:#555 !important;}
    input.price-sub-input{font-size:8px !important;color:#555 !important;width:auto !important;min-width:50px;}
    .panel-sub, .val-amber, .badge.internal, .section-nav button.active{color:#333 !important;}
    .tag{color:#000 !important;border-color:#999 !important;background:#fff !important;}
    .tag.tag-amber{color:#000 !important;border-color:#000 !important;font-weight:700;}
    .op-copy-text{color:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .subtle-panel{background:#fff !important;border:1px solid #999 !important;}
    input.cell-input::placeholder{color:#333 !important;opacity:1 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    select, input[type=text], input[type=number], input[type=date]{color:#000 !important;background:#fff !important;border-color:#999 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .placeholder-val{color:#777 !important;}
    .val-teal{color:#0a7d68 !important;}
    .val-green{color:#1a7a3c !important;}
    .readonly-field{color:#000 !important;}
    .field>span{color:#333 !important;}
    .note{color:#555 !important;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a href="#" class="back-link" id="homeBackLink" hidden>← 返回首頁</a>
    <div class="brand" id="brandText">🔧 車體工藝中心系統 <span class="tag">20260810 v5</span></div>
  </div>
  <div class="topbar-right">
    <span class="sync-pill busy" id="syncTag">連線中…</span>
    <button class="lock-pill" id="lockPill">🔒 解鎖</button>
    <nav class="toplinks" id="quoteNav" hidden>
      <button data-page="wholecar" class="active">整台車報價</button>
      <button data-page="local">局部貼膜估價</button>
      <button data-page="bodyshop">鈑烤估價</button>
      <button data-page="settings">系統設定</button>
    </nav>
  </div>
</div>

<main id="page-home"></main>
<main id="page-wholecar" hidden></main>
<main id="page-local" hidden></main>
<main id="page-bodyshop" hidden></main>
<main id="page-settings" hidden></main>
<main id="page-vehicle" hidden></main>
<div class="toast" id="toast"></div>
<input type="file" id="importFileInput" accept="application/json" hidden>

<div class="modal-overlay" id="unlockOverlay" hidden>
  <div class="modal-box unlock-box">
    <div class="modal-head">
      <div class="modal-title">輸入密碼以進入系統設定</div>
      <button class="btn sm ghost" id="unlockCloseX">✕</button>
    </div>
    <form id="unlockForm">
      <div class="modal-body">
        <label class="field">密碼
          <input type="password" id="unlockPassword" autocomplete="current-password" required autofocus style="font-family:'JetBrains Mono',monospace;">
        </label>
        <div class="unlock-error" id="unlockError"></div>
      </div>
      <div class="modal-foot">
        <button type="submit" class="btn primary">解鎖</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle"></div>
      <button class="btn sm ghost" id="modalCloseX">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" id="modalCancelBtn">取消</button>
      <button class="btn primary" id="modalDoneBtn">完成</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   資料模型 & 預設值（v14）
   ========================================================= */
const PART_ORDER_DEFAULT = ["迎風面","天橋(屋頂)","後視鏡(2個)","大燈(2個)","尾燈(2個)","水箱護罩(外一圈)","四門外把手(改色)","左側裙(單支)","右側裙(單支)"];
const CATEGORY_LIST = ["犀牛皮類","改色膜類"];
// 局部貼膜：只有這兩個部位有施工獎金／招攬獎金；其餘小部位仍可設定折扣售價，但沒有獎金
const BONUS_ELIGIBLE_PARTS = ["迎風面","天橋(屋頂)"];
const TAX_RATE = 0.05;

function defaultDiscountRules(kind){
  if(kind==='whole'){
    return [
      {id:'d'+Math.random().toString(36).slice(2,8), name:'75折', rate:0.75, bonusType:'fixed', bonusValue:3000},
      {id:'d'+Math.random().toString(36).slice(2,8), name:'8折',  rate:0.80, bonusType:'percent', bonusValue:0.05},
      {id:'d'+Math.random().toString(36).slice(2,8), name:'9折',  rate:0.90, bonusType:'percent', bonusValue:0.10},
      {id:'d'+Math.random().toString(36).slice(2,8), name:'原價(無折扣)', rate:1.00, bonusType:'percent', bonusValue:0.15}
    ];
  }
  return [
    {id:'d'+Math.random().toString(36).slice(2,8), name:'75折', rate:0.75, bonusType:'fixed', bonusValue:2000},
    {id:'d'+Math.random().toString(36).slice(2,8), name:'8折',  rate:0.80, bonusType:'fixed', bonusValue:3000},
    {id:'d'+Math.random().toString(36).slice(2,8), name:'9折',  rate:0.90, bonusType:'fixed', bonusValue:5000},
    {id:'d'+Math.random().toString(36).slice(2,8), name:'原價(無折扣)', rate:1.00, bonusType:'fixed', bonusValue:6000}
  ];
}

function emptyLocalPart(){ return {usage:null, hours:null}; }

const API_BASE = "http://localhost:4000/api";

/* ---- 密碼解鎖（僅系統設定頁需要；整台車/局部/鈑烤報價任何人都能直接使用）---- */
const AUTH_KEY = 'auth-session';
function getAuth(){
  try{ return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }catch(e){ return null; }
}
function setAuth(auth){ try{ localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }catch(e){} }
function clearAuth(){ try{ localStorage.removeItem(AUTH_KEY); }catch(e){} }
function isAdmin(){ return getAuth()?.role === 'admin'; }
function apiHeaders(withJson){
  const auth = getAuth();
  const h = {};
  if(auth?.token) h['Authorization'] = 'Bearer ' + auth.token;
  if(withJson) h['Content-Type'] = 'application/json';
  return h;
}
async function unlockWithPassword(password){
  const res = await fetch(`${API_BASE}/auth/unlock-settings`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ password })
  });
  const json = await res.json();
  if(!res.ok) throw new Error(json.error || '解鎖失敗');
  setAuth({ token: json.token, username: json.username, role: json.role });
}

function nowHM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

async function loadDB(){
  setSyncTag('busy', '連線中…');
  try{
    const res = await fetch(`${API_BASE}/quote-settings`, { headers: apiHeaders(false) });
    if(res.ok){
      const json = await res.json();
      DB = json.data; dbVersion = json.version;
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
      setSyncTag('ok', '已同步 · ' + nowHM());
      return;
    }
    if(res.status === 404){
      // 後端尚無資料：使用出廠預設值；已解鎖才寫回後端建立初始版本，避免一般訪客觸發無權限的寫入
      DB = factoryDB();
      if(isAdmin()){
        await saveDB();
      } else {
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
        setSyncTag('err', '尚無資料（解鎖後可建立）');
      }
      return;
    }
    throw new Error('後端回應異常：' + res.status);
  }catch(e){
    console.error(e);
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(err){}
    DB = raw ? JSON.parse(raw) : factoryDB();
    setSyncTag('err', '離線快取中');
  }
}
async function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
  setSyncTag('busy', '儲存中…');
  try{
    const res = await fetch(`${API_BASE}/quote-settings`, {
      method: 'PUT',
      headers: apiHeaders(true),
      body: JSON.stringify({ expectedVersion: dbVersion, data: DB })
    });
    if(res.status === 401 || res.status === 403){
      clearAuth(); updateAuthUI();
      setSyncTag('err', '離線快取中');
      toast('⚠ 編輯權限已失效，請重新解鎖後再試一次');
      return;
    }
    if(res.status === 409){
      setSyncTag('err', '版本衝突');
      toast('⚠ 資料已被其他裝置更新，請重新整理頁面');
      return;
    }
    if(!res.ok) throw new Error('儲存失敗：' + res.status);
    const json = await res.json();
    dbVersion = json.version;
    setSyncTag('ok', '已同步 · ' + nowHM());
  }catch(e){
    console.error(e);
    setSyncTag('err', '離線快取中');
    toast('⚠ 儲存失敗，已存於本機，恢復連線後請重新整理再試');
  }
}

/* =========================================================
   計算邏輯（v14）
   ========================================================= */
function fmt(n){ if(n==null||isNaN(n)) return null; return Math.round(n).toLocaleString('en-US'); }
// 未稅覆寫輸入框依實際顯示文字長度收縮寬度，不留多餘空白（等寬字型下 size 屬性＝字元數）
function inputSizeFor(text){ return Math.max(String(text||'').length, 1); }
// 金額類輸入框：顯示千分位逗號，輸入時允許帶逗號，儲存前去除逗號還原成數字
function formatMoney(n){ if(n==null||n===''||isNaN(n)) return ''; return Number(n).toLocaleString('en-US'); }
function parseMoney(str){ if(str==null) return null; const cleaned = String(str).replace(/,/g,'').trim(); if(cleaned==='') return null; const n=parseFloat(cleaned); return isNaN(n)?null:n; }
function moneyAttrs(){ return `type="text" inputmode="decimal" class="mono"`; }

function rollRate(rolls, usage){
  if(!rolls) return null;
  const valid = rolls.filter(r=>r && r.unit!=null && r.cost!=null && r.unit>0);
  if(valid.length===0) return null;
  const sorted = [...valid].sort((a,b)=>a.unit-b.unit);
  const fit = sorted.find(r=>usage <= r.unit + 0.0001);
  const chosen = fit || sorted[sorted.length-1];
  return chosen.cost/chosen.unit;
}

function getMaterial(brand, category, materialName){
  return DB.brands?.[brand]?.categories?.[category]?.materials?.[materialName] || null;
}

// mode: 'whole' | 'local'
function getMaterialCost(brand, category, materialName, usage, mode){
  if(usage==null) return {value:null, note:"使用米數尚未輸入"};
  const mat = getMaterial(brand, category, materialName);
  if(!mat) return {value:null, note:"材質不存在"};

  if(category==="犀牛皮類"){
    const rate = rollRate(mat.rolls, usage);
    if(rate==null) return {value:null, note:"尚未輸入捲成本"};
    return {value: usage*rate, note:`犀牛皮類，整捲反推 ${fmt(rate)}/米 × ${usage}米`};
  }
  // 改色膜類
  if(mode==='whole'){
    const rate = rollRate(mat.rolls, usage);
    if(rate==null) return {value:null, note:"尚未輸入捲成本"};
    return {value: usage*rate, note:`整台車模式，整捲反推 ${fmt(rate)}/米 × ${usage}米`};
  }
  if(mat.pieceRate==null) return {value:null, note:"尚未輸入散料每米價"};
  return {value: usage*mat.pieceRate, note:`局部模式，散料每米價 ${fmt(mat.pieceRate)} × ${usage}米`};
}

// 統一的報價行計算：輸入 表定售價(含稅)/材料成本/工時/施工獎金定值/折扣規則 -> 輸出全部欄位
// bonusEligible=false 時（局部貼膜的小部位）完全不計算招攬獎金，折扣售價本身仍照常計算
function computeLine({listPrice, materialCost, hours, installBonusVal, discountRule, override, bonusEligible=true}){
  const laborCost = (hours!=null) ? hours*DB.hourlyWage : null;
  const inclTaxList = (listPrice!=null && discountRule) ? listPrice*discountRule.rate : null;
  const exclTaxRaw = inclTaxList!=null ? inclTaxList/TAX_RATE_DIVISOR() : null;
  let exclTax = exclTaxRaw;
  const ov = override || {};
  if(ov.businessPrice!=null) exclTax = ov.businessPrice;
  // 含稅價依「實際成交(未稅)金額」回推，若業務/接待售價被覆寫，含稅價會跟著反映覆寫後的真實金額
  const inclTax = exclTax!=null ? exclTax*TAX_RATE_DIVISOR() : null;

  let bonusDefault = null;
  if(exclTax!=null && discountRule && bonusEligible){
    bonusDefault = discountRule.bonusType==='fixed' ? discountRule.bonusValue : exclTax*discountRule.bonusValue;
  }
  const bonus = bonusEligible ? (ov.bonus!=null ? ov.bonus : bonusDefault) : null;

  let profit = null;
  if(exclTax!=null && materialCost!=null && laborCost!=null && installBonusVal!=null && bonus!=null){
    profit = exclTax - materialCost - laborCost - installBonusVal - bonus;
  }
  const profitRate = (profit!=null && exclTax) ? profit/exclTax : null;
  return {laborCost, inclTax, exclTax, bonusDefault, bonus, profit, profitRate};
}
function TAX_RATE_DIVISOR(){ return 1 + TAX_RATE; }

function overrideKey(...parts){ return parts.join("|"); }

// 列印前防呆：檢查必填欄位（車型/廠商/規格/折扣規則 + 車牌/業務接待人員/自填最終規格/帳務歸屬/付款對象）是否都已填寫，
// 回傳缺漏欄位的文字說明陣列；空陣列代表可以列印
function validateWholeCarBeforePrint(){
  const missing = [];
  if(!wholeCarState.group) missing.push('車型群組');
  if(!wholeCarState.brand) missing.push('膜料廠商');
  if(!wholeCarState.category) missing.push('產品類別');
  if(!wholeCarState.material) missing.push('規格');
  const rules = DB.wholeCar.discountRules[wholeCarState.brand] || [];
  if(!rules.find(r=>r.id===wholeCarState.ruleId)) missing.push('折扣規則');
  if(!wholeCarState.licensePlate || !wholeCarState.licensePlate.trim()) missing.push('車牌(或車身碼)');
  if(!wholeCarState.salesStaff || !wholeCarState.salesStaff.trim()) missing.push('業務/接待人員');
  if(!wholeCarState.opManual || !wholeCarState.opManual.trim()) missing.push('自填最終規格');
  if(!wholeCarState.accountType) missing.push('帳務歸屬');
  if(!wholeCarState.paymentTarget) missing.push('付款對象');
  return missing;
}
function validateLocalBeforePrint(){
  const missing = [];
  if(!localState.brand) missing.push('膜料廠商');
  const rules = DB.local.discountRules[localState.brand] || [];
  if(!rules.find(r=>r.id===localState.ruleId)) missing.push('折扣規則');
  if(!localState.licensePlate || !localState.licensePlate.trim()) missing.push('車牌(或車身碼)');
  if(!localState.salesStaff || !localState.salesStaff.trim()) missing.push('業務/接待人員');
  const brandObj = DB.brands[localState.brand];
  localState.rows.forEach((row,idx)=>{
    const label = `第${idx+1}列（${row.part||'未命名部位'}）`;
    const matOptions = brandObj?.categories?.[row.category]?.materialOrder || [];
    if(!row.material || !matOptions.includes(row.material)) missing.push(`${label}規格`);
    if(!row.opManual || !row.opManual.trim()) missing.push(`${label}自填最終規格`);
    if(!row.accountType) missing.push(`${label}帳務歸屬`);
    if(!row.paymentTarget) missing.push(`${label}付款對象`);
  });
  return missing;
}
function showMissingFieldsModal(missing){
  openModal('列印前請先完整填寫', (body)=>{
    body.innerHTML = `
      <div style="margin-bottom:10px;color:var(--text-dim);font-size:13px;">以下欄位尚未填寫，請完成後再列印/PDF：</div>
      <ul style="margin:0;padding-left:20px;line-height:1.9;color:var(--amber);">
        ${missing.map(m=>`<li>${m}</li>`).join('')}

    `;
  });
}

function ruleSelectHtml(id, rules, selectedId){
  return `<select id="${id}">${rules.map(r=>{
    const bonusLabel = r.bonusType==='fixed' ? `定值${fmt(r.bonusValue)}元` : `比例${Math.round(r.bonusValue*100)}%`;
    return `<option value="${r.id}" ${r.id===selectedId?'selected':''}>${r.name}（${Math.round(r.rate*100)}%，獎金${bonusLabel}）</option>`;

}

let wholeCarState = { group:null, brand:null, category:null, material:null, ruleId:null, view:'internal', customerModel:'', date:null, opManual:'', accountType:null, paymentTarget:null, licensePlate:'', salesStaff:'' };

function ensureBrandCategoryMaterial(state){
  state.brand = state.brand && DB.brandOrder.includes(state.brand) ? state.brand : DB.brandOrder[0];
  const brandObj = DB.brands[state.brand];
  state.category = state.category && CATEGORY_LIST.includes(state.category) ? state.category : CATEGORY_LIST[0];
  let catObj = brandObj.categories[state.category];
  if(!catObj.materialOrder.length){
    const other = CATEGORY_LIST.find(c=>c!==state.category && brandObj.categories[c].materialOrder.length);
    if(other){ state.category = other; catObj = brandObj.categories[other]; }
  }
  state.material = state.material && catObj.materialOrder.includes(state.material) ? state.material : catObj.materialOrder[0];
  return { brandObj, catObj };
}

function renderWholeCarResult(){
  const wrap = document.getElementById('wcResultWrap');
  const {group, brand, category, material, view} = wholeCarState;
  if(!material){ wrap.innerHTML = `<div class="empty-hint">此廠商/類別尚未建立任何規格，請先到「系統設定」新增。</div>`; return; }

  const usage = DB.wholeCar.usage[group]?.[category];
  const hours = DB.wholeCar.hours[group];
  const costInfo = getMaterialCost(brand, category, material, usage, 'whole');
  const mat = getMaterial(brand, category, material);
  const listPrice = mat.priceByGroup[group];
  const installBonusVal = DB.installBonus["全車"];
  const rules = DB.wholeCar.discountRules[brand] || [];
  const rule = rules.find(r=>r.id===wholeCarState.ruleId) || rules[0];

  const key = overrideKey('whole', group, brand, category, material, rule?.id);
  const ov = DB.overrides[key] || {};
  const line = computeLine({listPrice, materialCost:costInfo.value, hours, installBonusVal, discountRule:rule, override:ov});

  if(view==='external'){
    wrap.innerHTML = `
      <div class="panel-sub" style="margin-bottom:10px;">日期：${wholeCarState.date} ｜ 客戶車款：${wholeCarState.customerModel || '<span class="placeholder-val">（未填寫）</span>'}</div>

          <td>${line.inclTax!=null?fmt(line.inclTax):'<span class="placeholder-val">尚未輸入</span>'}</td>
        </tr>
      </table>

  const priceLabel = rule?.name ? `${rule.name}售價` : '業務/接待售價';
  // 選「原價(無折扣)」時，折扣售價欄跟表定售價欄數字會完全一樣，此欄直接隱藏避免重複

  wrap.innerHTML = `
    <div class="table-scroll">
    <table class="data">
      <tr><th>部位</th><th>使用米數</th><th>工時</th><th>材料成本</th><th>人工成本</th><th>施工獎金</th><th>招攬獎金</th><th>表定售價</th>${isFullPrice?'':`<th>${priceLabel}</th>`}<th>售服毛利</th><th>毛利率</th></tr>
      <tr>

        <td>${installBonusVal!=null?fmt(installBonusVal):'<span class="placeholder-val">未設定</span>'}</td>
        <td><input class="cell-input" style="width:74px;" type="text" inputmode="decimal" placeholder="${line.bonusDefault!=null?formatMoney(Math.round(line.bonusDefault)):''}" value="${ov.bonus!=null?formatMoney(ov.bonus):''}" data-ov="${key}" data-field="bonus"></td>
        <td>

          `:'<span class="placeholder-val">尚未輸入</span>'}
        </td>

          <div class="mono price-main">${line.inclTax!=null?fmt(line.inclTax):'<span class="placeholder-val">—</span>'}</div>

            <input class="cell-input price-sub-input" type="text" inputmode="decimal" size="${inputSizeFor(ov.businessPrice!=null?formatMoney(ov.businessPrice):(line.exclTax!=null?formatMoney(Math.round(line.exclTax)):''))}" placeholder="${line.exclTax!=null&&ov.businessPrice==null?formatMoney(Math.round(line.exclTax)):''}" value="${ov.businessPrice!=null?formatMoney(ov.businessPrice):''}" data-ov="${key}" data-field="businessPrice">

    };
  });
}

    window.print();
  };
  const lcBrandSel = document.getElementById('lcBrand');
  if(lcBrandSel) lcBrandSel.onchange = e=>{
    localState.brand=e.target.value; localState.ruleId=null;
    localState.rows.forEach(r=>{
      const brandObj = DB.brands[localState.brand];
      if(!brandObj.categories[r.category] || !brandObj.categories[r.category].materialOrder.includes(r.material)){
        const cat = CATEGORY_LIST.find(c=>brandObj.categories[c].materialOrder.length>0) || CATEGORY_LIST[0];
        r.category = cat; r.material = brandObj.categories[cat].materialOrder[0] || '';
      }
    });
    renderLocalPage();
  };
  const ruleSel = document.getElementById('lcRule');
  if(ruleSel) ruleSel.onchange = e=>{ localState.ruleId=e.target.value; renderLocalTable(); };
  const cmInp = document.getElementById('lcCustomerModel');
  if(cmInp) cmInp.oninput = e=>{ localState.customerModel=e.target.value; };
  const dInp = document.getElementById('lcDate');
  if(dInp) dInp.onchange = e=>{ localState.date=e.target.value; renderLocalTable(); };
  const lcAddRowBtn = document.getElementById('lcAddRowBtn');
  if(lcAddRowBtn) lcAddRowBtn.onclick = ()=>{ localAddRow(); renderLocalTable(); };
  document.getElementById('lcClearBtn').onclick = ()=>{
    if(confirm('確定清空目前局部貼膜工單？此動作無法復原（不影響系統設定裡的部位資料）。')){
      localState.rows = []; localAddRow(); renderLocalPage();
    }
  };

  renderLocalTable();
}

function renderLocalTable(){
  const wrap = document.getElementById('localTableWrap');
  const { brand, view } = localState;
  const brandObj = DB.brands[brand];
  const rules = DB.local.discountRules[brand] || [];
  const rule = rules.find(r=>r.id===localState.ruleId) || rules[0];

  let totals = {materialCost:0, laborCost:0, installBonus:0, listPrice:0, inclTax:0, exclTax:0, bonus:0, profit:0};
  let any = {materialCost:false, exclTax:false};
  const opLines = [];
  // 選「原價(無折扣)」時，折扣售價欄跟表定售價欄數字會完全一樣，此欄直接隱藏避免重複
  const isFullPrice = rule && rule.rate === 1;

  const rows = localState.rows.map(row=>{
    const partData = DB.local.parts[row.part] || {usage:null,hours:null};
    const listPrice = DB.local.price[row.part]?.[brand]?.[row.category];
    const costInfo = getMaterialCost(brand, row.category, row.material, partData.usage, 'local');
    const installBonusVal = DB.installBonus[row.part];
    const bonusEligible = BONUS_ELIGIBLE_PARTS.includes(row.part);
    const key = 'localrow_'+row.id;
    const ov = { businessPrice: row.bizOverride, bonus: row.bonusOverride };
    const line = computeLine({listPrice, materialCost:costInfo.value, hours:partData.hours, installBonusVal, discountRule:rule, override:ov, bonusEligible});

    if(view==='internal'){
      opLines.push(buildOpCodeLine({scope:'local', part:row.part, brand, category:row.category, material:row.material, rowId:row.id, manualText:row.opManual, exclTax:line.exclTax, accountType:row.accountType, paymentTarget:row.paymentTarget}));
    }

    if(costInfo.value!=null){ totals.materialCost+=costInfo.value; any.materialCost=true; }
    if(line.laborCost!=null) totals.laborCost+=line.laborCost;
    if(installBonusVal!=null) totals.installBonus+=installBonusVal;
    if(listPrice!=null) totals.listPrice+=listPrice;
    if(line.inclTax!=null) totals.inclTax+=line.inclTax;
    if(line.exclTax!=null){ totals.exclTax+=line.exclTax; any.exclTax=true; }
    if(line.bonus!=null) totals.bonus+=line.bonus;
    if(line.profit!=null) totals.profit+=line.profit;

    const catOptions = CATEGORY_LIST.map(c=>{
      const has = brandObj.categories[c].materialOrder.length>0;
      return `<option value="${c}" ${c===row.category?'selected':''} ${has?'':'disabled'}>${c}${has?'':'（無規格）'}</option>`;
    }).join('');
    const matOptions = (brandObj.categories[row.category]?.materialOrder||[]).map(m=>`<option value="${m}" ${m===row.material?'selected':''}>${m}</option>`).join('') || '<option value="">（無規格）</option>';
    const partOptions = DB.partOrder.map(p=>`<option value="${p}" ${p===row.part?'selected':''}>${p}</option>`).join('');

    if(view==='external'){
      return `<tr>
        <td>${row.part}</td>
        <td>${row.material}（${brand}）</td>
        <td>${line.exclTax!=null?fmt(line.exclTax):'<span class="placeholder-val">—</span>'}</td>
        <td>${line.inclTax!=null?fmt(line.inclTax):'<span class="placeholder-val">—</span>'}</td>
      </tr>`;
    }

    return `<tr>
      <td><select data-row-field="part" data-row-id="${row.id}">${partOptions}</select></td>
      <td><select data-row-field="category" data-row-id="${row.id}">${catOptions}</select></td>
      <td><select data-row-field="material" data-row-id="${row.id}">${matOptions}</select></td>
      <td>${partData.usage!=null?partData.usage:'<span class="placeholder-val">未輸入</span>'}</td>
      <td>${partData.hours!=null?partData.hours:'<span class="placeholder-val">未輸入</span>'}</td>
      <td>${costInfo.value!=null?`<span class="val-teal">${fmt(costInfo.value)}</span><span class="info-dot" data-tip="${costInfo.note}">i</span>`:'<span class="placeholder-val">尚未輸入</span>'}</td>
      <td>${line.laborCost!=null?fmt(line.laborCost):'<span class="placeholder-val">—</span>'}</td>
      <td>${installBonusVal!=null?fmt(installBonusVal):'<span class="placeholder-val">未設定</span>'}</td>
      <td>${bonusEligible?`<input class="cell-input" style="width:74px;" type="text" inputmode="decimal" placeholder="${line.bonusDefault!=null?formatMoney(Math.round(line.bonusDefault)):''}" value="${row.bonusOverride!=null?formatMoney(row.bonusOverride):''}" data-ov-row="${row.id}" data-ov-field="bonusOverride">`:'<span class="placeholder-val">未設定</span>'}</td>
      <td>
        ${listPrice!=null?`
        <div class="mono price-main">${fmt(listPrice)}</div>
        <div class="price-sub">未稅 ${fmt(listPrice/TAX_RATE_DIVISOR())}</div>
        `:'<span class="placeholder-val">尚未輸入</span>'}
      </td>
      ${isFullPrice?'':`
      <td>
        <div class="mono price-main">${line.inclTax!=null?fmt(line.inclTax):'<span class="placeholder-val">—</span>'}</div>
        <div class="price-sub-row">
          <span class="price-sub-label">未稅</span>
          <input class="cell-input price-sub-input" type="text" inputmode="decimal" size="${inputSizeFor(row.bizOverride!=null?formatMoney(row.bizOverride):(line.exclTax!=null?formatMoney(Math.round(line.exclTax)):''))}" placeholder="${line.exclTax!=null&&row.bizOverride==null?formatMoney(Math.round(line.exclTax)):''}" value="${row.bizOverride!=null?formatMoney(row.bizOverride):''}" data-ov-row="${row.id}" data-ov-field="bizOverride">
        </div>
      </td>`}
      <td>${line.profit!=null?`<span class="val-green">${fmt(line.profit)}</span>`:'<span class="placeholder-val">—</span>'}</td>
      <td>${line.profitRate!=null?`${Math.round(line.profitRate*100)}%`:'<span class="placeholder-val">—</span>'}</td>
      <td><button class="btn sm danger no-print" data-del-row="${row.id}">刪除</button></td>
    </tr>`;
  }).join('');

  const priceLabel = rule?.name ? `${rule.name}售價` : '業務/接待售價';

  const head = view==='external'
    ? `<tr><th>部位</th><th>材質名稱</th><th>未稅售價</th><th>含稅售價</th></tr>`
    : `<tr><th>部位</th><th>類別</th><th>規格</th><th>使用米數</th><th>工時</th><th>材料成本</th><th>人工成本</th><th>施工獎金</th><th>招攬獎金</th><th>表定售價</th>${isFullPrice?'':`<th>${priceLabel}</th>`}<th>售服毛利</th><th>毛利率</th><th></th></tr>`;

  const totalRate = (totals.profit && totals.exclTax) ? totals.profit/totals.exclTax : null;
  const totalRow = view==='external'
    ? `<tr class="total-row"><td>合計</td><td></td><td>${any.exclTax?fmt(totals.exclTax):'—'}</td><td>${totals.inclTax?fmt(totals.inclTax):'—'}</td></tr>`
    : `<tr class="total-row"><td>合計</td><td></td><td></td><td></td><td></td><td>${any.materialCost?fmt(totals.materialCost):'—'}</td><td>${fmt(totals.laborCost)||'—'}</td><td>${fmt(totals.installBonus)||'—'}</td><td>${fmt(totals.bonus)||'—'}</td><td>${fmt(totals.listPrice)||'—'}</td>${isFullPrice?'':`<td>${fmt(totals.inclTax)||'—'}</td>`}<td>${fmt(totals.profit)||'—'}</td><td>${totalRate!=null?Math.round(totalRate*100)+'%':'—'}</td><td></td></tr>`;

  const dateLine = view==='external' ? `<div class="panel-sub" style="margin-bottom:10px;">日期：${localState.date} ｜ 客戶車款：${localState.customerModel || '<span class="placeholder-val">（未填寫）</span>'}</div>` : '';

  wrap.innerHTML = `${dateLine}<div class="table-scroll"><table class="data">${head}${rows}${totalRow}</table></div>${view==='internal'?opCodeBlockHtml(opLines, localState):''}`;

  bindOpInfoButtons(wrap, (rowId)=>localState.rows.find(r=>r.id===rowId), renderLocalTable);
  bindOpMetaInputs(wrap, localState);
  wrap.querySelectorAll('[data-opline-id]').forEach(inp=>{
    inp.oninput = ()=>{
      const row = localState.rows.find(r=>r.id===inp.dataset.oplineId);
      row.opManual = inp.value;
      const line = opLines.find(l=>l.rowId===row.id);
      if(line){
        line.manualText = inp.value;
        const textSpan = wrap.querySelector('.op-copy-text[data-opline-text="'+row.id+'"]');
        if(textSpan) textSpan.textContent = opLineFullText(line);
      }
    };
  });
  wrap.querySelectorAll('[data-row-field]').forEach(sel=>{
    sel.onchange = ()=>{
      const row = localState.rows.find(r=>r.id===sel.dataset.rowId);
      const field = sel.dataset.rowField;
      row[field] = sel.value;
      if(field==='category'){
        const opts = brandObj.categories[row.category]?.materialOrder||[];
        if(!opts.includes(row.material)) row.material = opts[0]||'';
      }
      renderLocalTable();
    };
  });
  wrap.querySelectorAll('[data-ov-row]').forEach(inp=>{
    inp.onchange = ()=>{
      const row = localState.rows.find(r=>r.id===inp.dataset.ovRow);
      row[inp.dataset.ovField] = parseMoney(inp.value);
      renderLocalTable();
    };
  });
  wrap.querySelectorAll('[data-del-row]').forEach(btn=>{
    btn.onclick = ()=>{
      localState.rows = localState.rows.filter(r=>r.id!==btn.dataset.delRow);
      if(localState.rows.length===0) localAddRow();
      renderLocalTable();
    };
  });
}

let bodyshopState = {
  brand: null, category: null, material: null,
  discountRate: 0.90, bonusRate: 0.10,
  rows: []
};

function bodyshopAddRow(part=""){
  bodyshopState.rows.push({ id:'row'+Date.now()+Math.random().toString(36).slice(2,6), part, usage:null, price:null, bizOverride:null, bonusOverride:null });
}

function renderBodyshopPage(){
  const el = document.getElementById('page-bodyshop');

  const brandObj = DB.brands[bodyshopState.brand];
  bodyshopState.category = bodyshopState.category && CATEGORY_LIST.includes(bodyshopState.category) && brandObj.categories[bodyshopState.category].materialOrder.length ? bodyshopState.category : (CATEGORY_LIST.find(c=>brandObj.categories[c].materialOrder.length>0) || CATEGORY_LIST[0]);

  el.innerHTML = `

        <div>
          <div class="panel-title">🔧 鈑烤估價（獨立空白工單）</div>
          <div class="panel-sub">不分車型大小，部位/使用米數/牌價每次自由輸入；材料成本仍串接所選廠商/類別/規格的成本表。折扣比例與業務獎金比例是「本張工單獨立設定」，不連動系統設定裡的折扣規則。此工單為暫存，離開頁面或重新整理後會清空。</div>
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="bsClearBtn">🗑 清空工單</button>
          <button class="btn no-print" id="bsPrintBtn">🖨️ 列印/PDF</button>
        </div>
      </div>
      <div class="quote-head">
        <label class="field">膜料廠商
          <select id="bsBrand">${DB.brandOrder.map(b=>`<option value="${b}" ${b===bodyshopState.brand?'selected':''}>${b}</option>`).join('')}</select>
        </label>
        <label class="field">產品類別
          <select id="bsCategory">${CATEGORY_LIST.map(c=>{
            const has = brandObj.categories[c].materialOrder.length>0;
            return `<option value="${c}" ${c===bodyshopState.category?'selected':''} ${has?'':'disabled'}>${c}${has?'':'（無規格）'}</option>`;
          }).join('')}</select>
        </label>
        <label class="field">規格（用於查材料成本表）
          <select id="bsMaterial">${catObj.materialOrder.map(m=>`<option value="${m}" ${m===bodyshopState.material?'selected':''}>${m}</option>`).join('') || '<option value="">（無規格）</option>'}</select>
        </label>
      </div>
      <div class="panel subtle-panel" style="margin-bottom:16px;">
        <div class="panel-sub" style="margin-bottom:10px;">本張工單獨立設定（不影響系統設定裡的折扣/獎金規則）</div>
        <div style="display:flex;gap:32px;flex-wrap:wrap;">
          <label class="field">折扣比例（業務價 = 牌價 × 此比例）
            <input type="number" id="bsDiscountInput" min="50" max="100" step="1" value="${Math.round(bodyshopState.discountRate*100)}"> %
          </label>
          <label class="field">業務獎金比例（獎金 = 業務價 × 此比例）
            <input type="number" id="bsBonusInput" min="0" max="30" step="1" value="${Math.round(bodyshopState.bonusRate*100)}"> %
          </label>

      </div>
      <div id="bodyshopTableWrap"></div>

  document.getElementById('bsBrand').onchange = e=>{ bodyshopState.brand=e.target.value; bodyshopState.category=null; bodyshopState.material=null; renderBodyshopPage(); };
  document.getElementById('bsCategory').onchange = e=>{ bodyshopState.category=e.target.value; bodyshopState.material=null; renderBodyshopPage(); };

function renderBodyshopTable(){
  const wrap = document.getElementById('bodyshopTableWrap');
  const { brand, category, material, discountRate, bonusRate } = bodyshopState;

  let totalCost=0, totalPrice=0, totalBiz=0, totalBonus=0, anyCost=false, anyPrice=false;

  const rows = bodyshopState.rows.map(row=>{
    const costInfo = getMaterialCost(brand, category, material, row.usage, 'local');
    const cost = costInfo.value;
    const price = row.price;
    if(cost!=null){ totalCost+=cost; anyCost=true; }
    if(price!=null){ totalPrice+=price; anyPrice=true; }

    const bizDefault = price!=null ? price*discountRate : null;
    const biz = row.bizOverride!=null ? row.bizOverride : bizDefault;
    const bonusDefault = biz!=null ? biz*bonusRate : null;
    const bonus = row.bonusOverride!=null ? row.bonusOverride : bonusDefault;
    if(biz!=null) totalBiz+=biz;
    if(bonus!=null) totalBonus+=bonus;

    const realProfit = (biz!=null && cost!=null && bonus!=null) ? biz-cost-bonus : null;
    const refProfit = (price!=null && cost!=null) ? price-cost : null;

    return `<tr>
      <td><input type="text" class="cell-input" style="width:140px;text-align:left;font-family:'Inter',sans-serif;" value="${row.part}" data-bs-field="part" data-bs-id="${row.id}" placeholder="部位名稱"></td>
      <td><input type="number" class="cell-input mono" step="0.1" value="${row.usage??''}" placeholder="米數" data-bs-field="usage" data-bs-id="${row.id}"></td>
      <td>${cost!=null? `<span class="val-teal">${fmt(cost)}</span><span class="info-dot" data-tip="${costInfo.note}">i</span>` : '<span class="placeholder-val">尚未輸入</span>'}</td>
      <td><input type="text" inputmode="decimal" class="cell-input" value="${row.price!=null?formatMoney(row.price):''}" placeholder="牌價(參考)" data-bs-field="price" data-bs-id="${row.id}"></td>
      <td><input type="text" inputmode="decimal" class="cell-input" placeholder="${bizDefault!=null?formatMoney(Math.round(bizDefault)):''}" value="${row.bizOverride!=null?formatMoney(row.bizOverride):''}" data-bs-field="bizOverride" data-bs-id="${row.id}"></td>
      <td><input type="text" inputmode="decimal" class="cell-input" placeholder="${bonusDefault!=null?formatMoney(Math.round(bonusDefault)):''}" value="${row.bonusOverride!=null?formatMoney(row.bonusOverride):''}" data-bs-field="bonusOverride" data-bs-id="${row.id}"></td>
      <td>${realProfit!=null?`<span class="val-green">${fmt(realProfit)}</span>`:'<span class="placeholder-val">—</span>'}</td>
      <td>${refProfit!=null?`<span class="placeholder-val mono">${fmt(refProfit)}</span>`:'<span class="placeholder-val">—</span>'}</td>
      <td><button class="btn sm danger" data-bs-del="${row.id}">刪除</button></td>
    </tr>`;
  }).join('');

  const totalRealProfit = (totalBiz && totalCost && totalBonus) ? totalBiz-totalCost-totalBonus : null;
  const totalRefProfit = (anyPrice && anyCost) ? totalPrice-totalCost : null;

  wrap.innerHTML = `<div class="table-scroll"><table class="data">
    <tr><th style="text-align:left;">部位（自由輸入）</th><th>使用米數</th><th>材料成本</th><th>牌價（參考，自由輸入）</th><th>業務價（實際成交價）</th><th>業務獎金</th><th>實際獲利</th><th>牌價參考獲利</th><th></th></tr>
    ${rows}
    <tr class="total-row"><td>合計</td><td></td><td>${anyCost?fmt(totalCost):'—'}</td><td>${anyPrice?fmt(totalPrice):'—'}</td><td>${fmt(totalBiz)||'—'}</td><td>${fmt(totalBonus)||'—'}</td><td>${totalRealProfit!=null?fmt(totalRealProfit):'—'}</td><td>${totalRefProfit!=null?fmt(totalRefProfit):'—'}</td><td></td></tr>
  </table></div>`;

  wrap.querySelectorAll('[data-bs-id]').forEach(inp=>{
    inp.onchange = ()=>{
      const row = bodyshopState.rows.find(r=>r.id===inp.dataset.bsId);
      const field = inp.dataset.bsField;
      if(field==='part') row.part = inp.value;
      else row[field] = parseMoney(inp.value);
      renderBodyshopTable();
    };
  });
  wrap.querySelectorAll('[data-bs-del]').forEach(btn=>{
    btn.onclick = ()=>{
      bodyshopState.rows = bodyshopState.rows.filter(r=>r.id!==btn.dataset.bsDel);
      renderBodyshopTable();
    };
  });
}

let groupsTabState = null;
function renderGroupsSettings(body){
  groupsTabState = groupsTabState && DB.groupOrder.includes(groupsTabState) ? groupsTabState : DB.groupOrder[0];
  const g = groupsTabState;

  body.innerHTML = `
    <div class="panel" style="max-width:640px;">
      <div class="panel-head">
        <div>
          <div class="panel-title">⚙️ 全系統參數</div>
          <div class="panel-sub">人工成本 = 表定工時 × 時薪</div>
        </div>
        <button class="btn primary" id="btnSaveAllTop">💾 儲存設定</button>
      </div>
      <div style="display:flex;gap:24px;flex-wrap:wrap;">
        <label class="field" style="max-width:200px;">人工時薪（元/小時）
          <input type="text" inputmode="decimal" class="mono" id="hourlyWageInput" value="${formatMoney(DB.hourlyWage)}">
        </label>
        <label class="field" style="max-width:200px;">內部資訊：零件比例（%）
          <input type="number" min="0" max="100" step="1" class="mono" id="partsRatioInput" value="${DB.partsRatioPercent}">
        </label>
        <div class="field" style="max-width:200px;">工資比例（%，＝100－零件比例）
          <div class="readonly-field" id="laborRatioDisplay" style="padding:9px 0;font-size:13px;">${100-DB.partsRatioPercent}%</div>
        </div>
      </div>
    </div>
    <div class="panel" style="max-width:640px;">
      <div class="panel-head">
        <div>
          <div class="panel-title">🚗 車型群組（小車／一般車／大車）</div>
          <div class="panel-sub">整台車模式只計算「全車」這一筆，工時/使用米數為單一定值（不分部位）</div>
        </div>
        <button class="btn" id="btnResetAll">↺ 還原全部預設</button>
      </div>
      <label class="field" style="max-width:220px;margin-bottom:16px;">全車施工獎金（元，不分車型大小，跟局部部位共用同一份施工獎金設計）
        <input type="text" inputmode="decimal" class="mono" id="fullCarBonusInput" value="${DB.installBonus['全車']!=null?formatMoney(DB.installBonus['全車']):''}" placeholder="未輸入">
      </label>
      <div class="pill-tabs" id="groupTabs">
        ${DB.groupOrder.map(name=>`<button data-g="${name}" class="${name===g?'active':''}">${name}</button>`).join('')}
      </div>
      <div style="display:flex;gap:24px;flex-wrap:wrap;">
        <label class="field">全車工時（不分產品類別）
          <input type="number" step="0.5" id="wcHoursInput" value="${DB.wholeCar.hours[g]??''}" placeholder="未輸入">
        </label>
        <label class="field">全車使用米數 — 犀牛皮類
          <input type="number" step="0.1" id="wcUsageRhinoInput" value="${DB.wholeCar.usage[g]?.['犀牛皮類']??''}" placeholder="未輸入">
        </label>
        <label class="field">全車使用米數 — 改色膜類
          <input type="number" step="0.1" id="wcUsageColorInput" value="${DB.wholeCar.usage[g]?.['改色膜類']??''}" placeholder="未輸入">
        </label>
      </div>
    </div>
    <div class="panel" style="max-width:640px;">
      <div class="panel-head">
        <div>
          <div class="panel-title">🗄️ 資料備份／搬移</div>
          <div class="panel-sub">將目前整份系統設定（不含暫存工單）匯出成 JSON 檔備份，或從備份檔還原</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn sm" id="btnExportDB">⭳ 匯出設定 JSON</button>
        <button class="btn sm" id="btnImportDB">⭱ 從檔案匯入</button>
      </div>
    </div>
  `;

  document.getElementById('btnSaveAllTop').onclick = async ()=>{
    DB.hourlyWage = parseMoney(document.getElementById('hourlyWageInput').value)||0;
    await saveDB(); toast('已儲存設定');
  };
  document.getElementById('partsRatioInput').onchange = async e=>{
    let v = parseFloat(e.target.value);
    if(isNaN(v)) v = 70;
    v = Math.min(100, Math.max(0, v));
    DB.partsRatioPercent = v;
    e.target.value = v;
    document.getElementById('laborRatioDisplay').textContent = (100-v)+'%';
    await saveDB(); renderWholeCarPage();
  };
  document.getElementById('btnResetAll').onclick = async ()=>{
    if(confirm('確定要還原「全部」設定為出廠預設值嗎？此動作無法復原。')){
      DB = factoryDB(); ensureDiscountDefaults(); await saveDB(); toast('已還原為出廠預設'); renderSettingsPage(); renderWholeCarPage();
    }
  };
  body.querySelectorAll('#groupTabs button[data-g]').forEach(b=>{
    b.onclick=()=>{ groupsTabState=b.dataset.g; renderGroupsSettings(body); };
  });
  document.getElementById('fullCarBonusInput').onchange = async e=>{
    DB.installBonus['全車'] = parseMoney(e.target.value);
    await saveDB(); renderWholeCarPage(); renderLocalPage();
  };
  document.getElementById('wcHoursInput').onchange = async e=>{
    DB.wholeCar.hours[g] = e.target.value===''? null : parseFloat(e.target.value);
    await saveDB(); renderWholeCarPage();
  };
  document.getElementById('wcUsageRhinoInput').onchange = async e=>{
    DB.wholeCar.usage[g] = DB.wholeCar.usage[g] || emptyUsageByCategory();
    DB.wholeCar.usage[g]['犀牛皮類'] = e.target.value===''? null : parseFloat(e.target.value);
    await saveDB(); renderWholeCarPage();
  };
  document.getElementById('wcUsageColorInput').onchange = async e=>{
    DB.wholeCar.usage[g] = DB.wholeCar.usage[g] || emptyUsageByCategory();
    DB.wholeCar.usage[g]['改色膜類'] = e.target.value===''? null : parseFloat(e.target.value);
    await saveDB(); renderWholeCarPage();
  };
  document.getElementById('btnExportDB').onclick = exportDB;
  document.getElementById('btnImportDB').onclick = ()=> document.getElementById('importFileInput').click();
}

/* ---- 3.2 廠商與材質成本（卡片清單 + 彈出視窗編輯） ---- */
let materialsTabState = null;
let materialsCatState = null;
function renderMaterialsSettings(body){
  materialsTabState = materialsTabState && DB.brandOrder.includes(materialsTabState) ? materialsTabState : DB.brandOrder[0];
  const brandName = materialsTabState;
  const brand = DB.brands[brandName];
  materialsCatState = materialsCatState && CATEGORY_LIST.includes(materialsCatState) ? materialsCatState : CATEGORY_LIST[0];
  const cat = materialsCatState;
  const catObj = brand.categories[cat];

  body.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">🎨 廠商與材質成本</div>
          <div class="panel-sub">廠商 → 產品類別（犀牛皮類/改色膜類）→ 規格。這裡只建立成本資料（捲成本、散料成本），售價請到「整台車售價」「部位清單」分頁設定</div>
        </div>
      </div>
      <div class="pill-tabs" id="brandTabs">
        ${DB.brandOrder.map(b=>`<button data-b="${b}" class="${b===brandName?'active':''}">${b}</button>`).join('')}
        <button class="add" id="addBrandBtn">＋ 新增廠商</button>
      </div>
      <div class="pill-tabs" id="catTabs">
        ${CATEGORY_LIST.map(c=>`<button data-c="${c}" class="${c===cat?'active':''}">${c}</button>`).join('')}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title" style="font-size:15px;">${brandName} — ${cat} 規格清單</div>
        <button class="btn primary sm" id="addMaterialBtn">＋ 新增規格</button>
      </div>
      <div id="materialsList" class="card-grid"></div>
    </div>
  `;
  body.querySelectorAll('#brandTabs button[data-b]').forEach(b=>{
    b.onclick=()=>{ materialsTabState=b.dataset.b; renderMaterialsSettings(body); };
  });
  body.querySelectorAll('#catTabs button[data-c]').forEach(b=>{
    b.onclick=()=>{ materialsCatState=b.dataset.c; renderMaterialsSettings(body); };
  });
  document.getElementById('addBrandBtn').onclick = async ()=>{
    const name = prompt('新廠商名稱？（例如：大陸品牌）');
    if(!name || DB.brands[name]) return;
    DB.brands[name] = { categories: { "犀牛皮類":{materialOrder:[],materials:{}}, "改色膜類":{materialOrder:[],materials:{}} } };
    DB.brandOrder.push(name);
    DB.wholeCar.discountRules[name] = defaultDiscountRules('whole');
    DB.local.discountRules[name] = defaultDiscountRules('local');
    await saveDB(); materialsTabState=name; toast('已新增廠商：'+name); renderSettingsPage(); renderWholeCarPage();
  };

  renderMaterialCards(body, brandName, cat, catObj);

  document.getElementById('addMaterialBtn').onclick = async ()=>{
    const name = prompt(`新規格名稱？（${brandName} / ${cat}）`);
    if(!name || catObj.materialOrder.includes(name)) return;
    catObj.materialOrder.push(name);
    catObj.materials[name] = { rolls:[{unit:15,cost:null}], pieceRate: cat==='改色膜類'?null:undefined, priceByGroup: emptyPriceByGroup() };
    await saveDB(); renderMaterialsSettings(body); renderWholeCarPage();
  };
}

function renderMaterialCards(body, brandName, cat, catObj){
  const listEl = body.querySelector('#materialsList');
  listEl.innerHTML = catObj.materialOrder.map(mat=>{
    const m = catObj.materials[mat];
    const rollTags = (m.rolls||[]).filter(r=>r.unit!=null&&r.cost!=null).map(r=>`<span class="tag tag-green">${r.unit}米＝${formatMoney(r.cost)}</span>`).join('') || `<span class="tag">尚無捲成本</span>`;
    const pieceTag = cat==='改色膜類' ? (m.pieceRate!=null ? `<span class="tag tag-amber">散料 ${formatMoney(m.pieceRate)}/米</span>` : `<span class="tag">散料價未設定</span>`) : '';
    return `
      <div class="item-card">
        <div class="item-main">
          <div class="item-title">${mat}</div>
          <div class="item-tags">${rollTags}${pieceTag}</div>
        </div>
        <div class="item-actions">
          <button class="btn sm" data-edit-material="${mat}">編輯</button>
          <button class="btn sm danger" data-del-material="${mat}">刪除</button>
        </div>
      </div>
    `;
  }).join('') || `<div class="empty-hint">此廠商／類別尚未建立任何規格</div>`;

  listEl.querySelectorAll('[data-del-material]').forEach(btn=>{
    btn.onclick = async ()=>{
      const mat = btn.dataset.delMaterial;
      if(!confirm(`確定刪除規格「${mat}」？`)) return;
      catObj.materialOrder = catObj.materialOrder.filter(x=>x!==mat);
      delete catObj.materials[mat];
      await saveDB(); renderMaterialCards(body, brandName, cat, catObj); renderWholeCarPage();
    };
  });
  listEl.querySelectorAll('[data-edit-material]').forEach(btn=>{
    btn.onclick = ()=>{
      const mat = btn.dataset.editMaterial;
      openModal(`編輯規格：${mat}`, (modalBody, refresh)=>{
        const m = catObj.materials[mat];
        const rollRows = (m.rolls||[]).map((r,idx)=>`
          <div class="roll-row">
            <input type="number" class="mono" style="width:90px;" value="${r.unit??''}" placeholder="捲長" data-mroll-unit="${idx}">
            <span class="note">米，成本</span>
            <input type="text" inputmode="decimal" class="mono" style="width:110px;" value="${r.cost!=null?formatMoney(r.cost):''}" placeholder="捲成本" data-mroll-cost="${idx}">
            <button class="btn sm danger" data-mroll-del="${idx}">刪除</button>
          </div>
        `).join('') || '<div class="empty-hint">尚未新增捲規格</div>';
        const pieceField = cat==='改色膜類' ? `
          <div class="panel-sub" style="margin:16px 0 6px;">散料每米價（局部模式用）</div>
          <input type="text" inputmode="decimal" class="mono" style="width:160px;" value="${m.pieceRate!=null?formatMoney(m.pieceRate):''}" data-mpiece>` : '';
        modalBody.innerHTML = `
          <div class="panel-sub" style="margin-bottom:8px;">捲規格清單（捲長米數 → 該捲成本；${cat==='犀牛皮類'?'不論整台車或局部，一律整捲反推':'整台車模式用整捲反推'}）</div>
          <div style="margin-bottom:10px;">${rollRows}</div>
          <button class="btn sm" id="mAddRoll">＋ 新增捲規格</button>
          ${pieceField}
        `;
        modalBody.querySelectorAll('[data-mroll-unit]').forEach(inp=>{
          inp.onchange = async ()=>{ m.rolls[+inp.dataset.mrollUnit].unit = inp.value===''?null:parseFloat(inp.value); await saveDB(); renderWholeCarPage(); };
        });
        modalBody.querySelectorAll('[data-mroll-cost]').forEach(inp=>{
          inp.onchange = async ()=>{ m.rolls[+inp.dataset.mrollCost].cost = parseMoney(inp.value); await saveDB(); renderWholeCarPage(); };
        });
        modalBody.querySelectorAll('[data-mroll-del]').forEach(delBtn=>{
          delBtn.onclick = async ()=>{ m.rolls.splice(+delBtn.dataset.mrollDel,1); await saveDB(); refresh(); renderWholeCarPage(); };
        });
        modalBody.querySelector('#mAddRoll').onclick = async ()=>{ m.rolls.push({unit:null,cost:null}); await saveDB(); refresh(); };
        const pieceInp = modalBody.querySelector('[data-mpiece]');
        if(pieceInp) pieceInp.onchange = async ()=>{ m.pieceRate = parseMoney(pieceInp.value); await saveDB(); };
      }, ()=>{ renderMaterialCards(body, brandName, cat, catObj); });
    };
  });
}

/* ---- 整台車售價設定（依規格×車型群組，跟成本資料分開維護） ---- */
let wcPriceBrandState = null;
function renderWholeCarPriceSettings(body){
  wcPriceBrandState = wcPriceBrandState && DB.brandOrder.includes(wcPriceBrandState) ? wcPriceBrandState : DB.brandOrder[0];
  const brandName = wcPriceBrandState;
  const brandObj = DB.brands[brandName];

  body.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">🏷️ 整台車模式售價</div>
          <div class="panel-sub">整台車報價只計算「全車」這一筆，售價依「規格×車型群組」各自輸入絕對值（不同規格可以不同價，不共用）</div>
        </div>
        <button class="btn primary" id="btnSaveAllPrice">💾 儲存設定</button>
      </div>
      <div class="pill-tabs" id="priceBrandTabs">
        ${DB.brandOrder.map(b=>`<button data-b="${b}" class="${b===brandName?'active':''}">${b}</button>`).join('')}
      </div>
    </div>
    ${CATEGORY_LIST.map(cat=>{
      const catObj = brandObj.categories[cat];
      if(!catObj.materialOrder.length) return '';
      const rows = catObj.materialOrder.map(mat=>{
        const m = catObj.materials[mat];
        const cells = DB.groupOrder.map(g=>`
          <td><input type="text" inputmode="decimal" class="cell-input mono" value="${m.priceByGroup[g]!=null?formatMoney(m.priceByGroup[g]):''}" placeholder="未輸入" data-wcprice="${brandName}|${cat}|${mat}|${g}"></td>`).join('');
        return `<tr><td style="text-align:left;">${mat}</td>${cells}</tr>`;
      }).join('');
      return `<div class="panel" style="max-width:640px;">
        <div class="panel-title" style="font-size:15px;margin-bottom:8px;">${brandName} — ${cat}</div>
        <div class="table-scroll">
        <table class="data">
          <tr><th style="text-align:left;">規格</th>${DB.groupOrder.map(g=>`<th>${g}</th>`).join('')}</tr>
          ${rows}
        </table>
        </div>
      </div>`;
    }).join('') || `<div class="panel"><div class="empty-hint">此廠商尚未建立任何規格，請先到「廠商與材質成本」新增</div></div>`}
  `;

  document.getElementById('btnSaveAllPrice').onclick = async ()=>{ await saveDB(); toast('已儲存設定'); };
  body.querySelectorAll('#priceBrandTabs button[data-b]').forEach(b=>{
    b.onclick=()=>{ wcPriceBrandState=b.dataset.b; renderWholeCarPriceSettings(body); };
  });
  body.querySelectorAll('[data-wcprice]').forEach(inp=>{
    inp.onchange = async ()=>{
      const [bn,cat,mat,g] = inp.dataset.wcprice.split('|');
      DB.brands[bn].categories[cat].materials[mat].priceByGroup[g] = parseMoney(inp.value);
      await saveDB(); renderWholeCarPage();
    };
  });
}

/* ---- 3.3 部位／局部售價／施工獎金 ---- */
function renderLocalPartsSettings(body){
  const brandCatCols = [];
  DB.brandOrder.forEach(bn=>{
    CATEGORY_LIST.forEach(c=>{
      brandCatCols.push({brand:bn, cat:c, has: DB.brands[bn].categories[c].materialOrder.length>0});
    });
  });

  body.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">🧱 部位清單管理</div>
          <div class="panel-sub">全域共用一份部位名稱清單（供局部貼膜估價與施工獎金使用；「全車」為整台車模式專用，只能設施工獎金）</div>
        </div>
      </div>
      <div class="chips" id="partChips">
        ${DB.partOrder.map(p=>`<span class="chip">${p} <button data-rm-part="${p}">✕</button></span>`).join('')}
      </div>
      <div class="add-inline">
        <input type="text" id="newPartInput" placeholder="新增部位名稱">
        <button class="btn sm" id="addPartBtn">＋ 新增部位</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">📐 局部模式：使用米數／工時／施工獎金／售價</div>
          <div class="panel-sub">使用米數與工時為單一值（不分車型大小）；售價依「部位×廠商×產品類別」，同類別規格共用。表格會列出全部局部部位，往下捲動即可看到所有資料（「全車」的施工獎金請到「車型群組」頁設定）</div>
        </div>
        <button class="btn primary" id="btnSaveAll3">💾 儲存設定</button>
      </div>
      <div style="overflow-x:auto;">
      <table class="data">
        <tr>
          <th style="text-align:left;">部位</th>
          <th>使用米數</th>
          <th>工時</th>
          <th>施工獎金</th>
          ${brandCatCols.map(c=>`<th>${c.brand}<br>${c.cat}</th>`).join('')}
        </tr>
        ${DB.partOrder.map(part=>{
          const pd = DB.local.parts[part] || emptyLocalPart();
          const priceCells = brandCatCols.map(c=>{
            const val = DB.local.price[part]?.[c.brand]?.[c.cat];
            return `<td><input type="text" inputmode="decimal" class="cell-input mono" value="${val!=null?formatMoney(val):''}" placeholder="${c.has?'未輸入':'—'}" data-local-price="${part}|${c.brand}|${c.cat}" ${c.has?'':'disabled'}></td>`;
          }).join('');
          return `<tr>
            <td style="text-align:left;">${part}</td>
            <td><input type="number" step="0.1" class="cell-input mono" value="${pd.usage??''}" placeholder="未輸入" data-part-usage="${part}"></td>
            <td><input type="number" step="0.5" class="cell-input mono" value="${pd.hours??''}" placeholder="未輸入" data-part-hours="${part}"></td>
            <td><input type="text" inputmode="decimal" class="cell-input mono" value="${DB.installBonus[part]!=null?formatMoney(DB.installBonus[part]):''}" placeholder="未輸入" data-bonus-part="${part}"></td>
            ${priceCells}
          </tr>`;
        }).join('')}
      </table>
      </div>
    </div>
  `;

  document.getElementById('addPartBtn').onclick = async ()=>{
    const inp = document.getElementById('newPartInput');
    const v = inp.value.trim();
    if(!v || DB.partOrder.includes(v) || v==='全車') return;
    DB.partOrder.push(v);
    DB.local.parts[v] = emptyLocalPart();
    DB.local.price[v] = {};
    DB.installBonus[v] = null;
    inp.value='';
    await saveDB(); renderLocalPartsSettings(body); renderLocalPage();
  };
  body.querySelectorAll('[data-rm-part]').forEach(btn=>{
    btn.onclick = async ()=>{
      const p = btn.dataset.rmPart;
      if(!confirm(`確定刪除部位「${p}」？將移除相關使用米數/工時/售價/施工獎金資料。`)) return;
      DB.partOrder = DB.partOrder.filter(x=>x!==p);
      delete DB.local.parts[p]; delete DB.local.price[p]; delete DB.installBonus[p];
      await saveDB(); renderLocalPartsSettings(body); renderLocalPage();
    };
  });
  document.getElementById('btnSaveAll3').onclick = async ()=>{ await saveDB(); toast('已儲存設定'); };

  body.querySelectorAll('[data-part-usage]').forEach(inp=>{
    inp.onchange = async ()=>{
      const p = inp.dataset.partUsage;
      DB.local.parts[p].usage = inp.value===''? null : parseFloat(inp.value);
      await saveDB(); renderLocalPage();
    };
  });
  body.querySelectorAll('[data-part-hours]').forEach(inp=>{
    inp.onchange = async ()=>{
      const p = inp.dataset.partHours;
      DB.local.parts[p].hours = inp.value===''? null : parseFloat(inp.value);
      await saveDB(); renderLocalPage();
    };
  });
  body.querySelectorAll('[data-bonus-part]').forEach(inp=>{
    inp.onchange = async ()=>{
      const p = inp.dataset.bonusPart;
      DB.installBonus[p] = parseMoney(inp.value);
      await saveDB(); renderWholeCarPage(); renderLocalPage();
    };
  });
  body.querySelectorAll('[data-local-price]').forEach(inp=>{
    inp.onchange = async ()=>{
      const [p,bn,c] = inp.dataset.localPrice.split('|');
      DB.local.price[p] = DB.local.price[p] || {};
      DB.local.price[p][bn] = DB.local.price[p][bn] || {};
      DB.local.price[p][bn][c] = parseMoney(inp.value);
      await saveDB(); renderLocalPage();
    };
  });
}

/* ---- 3.4 折扣／業務獎金規則 ---- */
let rulesModeState = 'whole';
let rulesBrandState = null;
function ensureDiscountDefaults(){
  DB.brandOrder.forEach(bn=>{
    if(!DB.wholeCar.discountRules[bn]) DB.wholeCar.discountRules[bn] = defaultDiscountRules('whole');
    if(!DB.local.discountRules[bn]) DB.local.discountRules[bn] = defaultDiscountRules('local');
  });
}

  const partFills = Object.assign({}, newParts, {

    if(DB.local.parts[p].hours==null) DB.local.parts[p].hours = partFills[p].hours;

function ensureDiscountBonusFix20260817(){

function renderRuleCards(body, list){
  const rowsEl = document.getElementById('ruleRows');
  rowsEl.innerHTML = `
    <table class="data">
      <tr><th style="text-align:left;">規則名稱</th><th>折扣(%)</th><th>獎金演算法</th><th>獎金數值</th><th></th></tr>
      ${list.map(r=>`
        <tr>
          <td style="text-align:left;"><input type="text" class="cell-input" style="width:130px;text-align:left;font-family:'Inter',sans-serif;" value="${r.name}" data-rule-field="name" data-rule-id="${r.id}"></td>
          <td><input type="number" class="cell-input" value="${Math.round(r.rate*100)}" data-rule-field="rate" data-rule-id="${r.id}"></td>
          <td>
            <select data-rule-field="bonusType" data-rule-id="${r.id}">
              <option value="fixed" ${r.bonusType==='fixed'?'selected':''}>定值（元）</option>
              <option value="percent" ${r.bonusType==='percent'?'selected':''}>比例（%）</option>
            </select>
          </td>
          <td><input type="${r.bonusType==='fixed'?'text':'number'}" ${r.bonusType==='fixed'?'inputmode="decimal"':''} class="cell-input mono" value="${r.bonusType==='fixed'?formatMoney(r.bonusValue):Math.round(r.bonusValue*100)}" data-rule-field="bonusValue" data-rule-id="${r.id}"></td>
          <td><button class="btn sm danger" data-del-rule="${r.id}">刪除</button></td>
        </tr>
      `).join('') || `<tr><td colspan="5"><div class="empty-hint">尚無規則</div></td></tr>`}
    </table>
  `;

  rowsEl.querySelectorAll('[data-rule-field]').forEach(inp=>{
    inp.onchange = async ()=>{
      const r = list.find(x=>x.id===inp.dataset.ruleId);
      const field = inp.dataset.ruleField;
      if(field==='name') r.name = inp.value;
      else if(field==='rate') r.rate = parseFloat(inp.value)/100;
      else if(field==='bonusType') { r.bonusType = inp.value; renderRuleCards(body, list); }
      else if(field==='bonusValue') r.bonusValue = r.bonusType==='fixed' ? parseMoney(inp.value) : parseFloat(inp.value)/100;
      await saveDB(); renderWholeCarPage(); renderLocalPage();
    };
  });
  rowsEl.querySelectorAll('[data-del-rule]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(list.length<=1){ alert('至少需保留一條規則'); return; }
      const idx = list.findIndex(x=>x.id===btn.dataset.delRule);
      list.splice(idx,1);
      await saveDB(); renderRuleCards(body, list); renderWholeCarPage(); renderLocalPage();
    };
  });
}

    activatePage(page);
  };
});

document.getElementById('importFileInput').onchange = (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(file) importDBFromFile(file);
};

document.getElementById('unlockForm').onsubmit = async (e)=>{
  e.preventDefault();
  const password = document.getElementById('unlockPassword').value;
  try{
    await unlockWithPassword(password);
    hideUnlockOverlay();
    updateAuthUI();
    const cb = pendingUnlockCallback; pendingUnlockCallback = null;
    if(cb) cb();
  }catch(err){
    document.getElementById('unlockError').textContent = err.message;
  }
};
document.getElementById('unlockCloseX').onclick = hideUnlockOverlay;
document.getElementById('lockPill').onclick = ()=>{
  if(isAdmin()){
    clearAuth();
    updateAuthUI();
    if(!document.getElementById('page-settings').hidden) activatePage('wholecar');
    toast('已鎖定系統設定');
  } else {
    showUnlockOverlay();
  }
};

(async function init(){
  await loadDB();
  const before = JSON.stringify(DB);
  ensureDiscountDefaults();
  ensureUsageStructure();
  ensureV14DataFill();
  ensureFullPriceBonusRule();
  ensureLocalFullPriceRule();
  ensureDiscountBonusFix20260817();
  ensurePartsRatioDefault();
  ensureOpCodes();
  // 只有資料真的被這些一次性遷移函式改過、且目前是解鎖狀態時才寫回後端；
  // 一般訪客（未解鎖）仍會在本次瀏覽階段套用這些修正值，只是不會嘗試寫入後端
  if(JSON.stringify(DB) !== before && isAdmin()){
    await saveDB();
  }
  showModule('home');
  updateAuthUI();
})();
</script>
</body>
</html>
